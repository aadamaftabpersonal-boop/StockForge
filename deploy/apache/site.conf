# Site rules shared by the HTTPS vhost and (dev only) the plain-HTTP vhost. Included from httpd.conf.
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options None
    Require all granted
    DirectoryIndex index.html
</Directory>

# ---- headers for everything we serve
Header always set Strict-Transport-Security "max-age=31536000"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
# Static pages: scripts, styles, fonts and XHR only from our own origin. There are no inline scripts or styles.
<If "%{REQUEST_URI} !~ m#^/(api|healthz)#">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
</If>
<LocationMatch "^/assets/fonts/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<LocationMatch "^/assets/(css|js)/">
    Header set Cache-Control "public, max-age=300, must-revalidate"
</LocationMatch>
<LocationMatch "^/(index\.html|admin/)?$">
    Header set Cache-Control "no-cache"
</LocationMatch>
AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

# ---- reverse proxy. mod_proxy APPENDS the client address to X-Forwarded-For, which is exactly what the
# app (SF_TRUST_PROXY=1) reads: the LAST entry, the one Apache itself observed.
ProxyPreserveHost On
ProxyAddHeaders On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass        /api/    http://app:8080/api/ timeout=30
ProxyPassReverse /api/    http://app:8080/api/
ProxyPass        /healthz http://app:8080/healthz timeout=10
ProxyPassReverse /healthz http://app:8080/healthz

# The metrics endpoint is for operators inside the network; it is never routed publicly.
<Location "/metrics">
    Require all denied
</Location>
