# Apache 2.4 in front of stockforged: TLS, static files, reverse proxy, and the edge protections the
# C server deliberately leaves to it (slow-client defence, HSTS, CSP for HTML, no public /metrics).
ServerRoot "/usr/local/apache2"
ServerName localhost
User daemon
Group daemon

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Listen 80
Listen 443

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{X-Forwarded-For}i %h \"%r\" %>s %b %D us" combined_us
CustomLog /proc/self/fd/1 combined_us
PidFile /usr/local/apache2/logs/httpd.pid
TypesConfig conf/mime.types
AddType application/javascript .js
AddType image/svg+xml .svg
AddType font/woff2 .woff2

# Slow-client (slowloris) defence: the C server is a blocking worker pool, so Apache must take the
# hit. It receives and validates the WHOLE request before the backend ever sees a byte of it.
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
Timeout 30
KeepAlive On
KeepAliveTimeout 5
LimitRequestBody 70000
LimitRequestFields 50
LimitRequestFieldSize 8000
LimitRequestLine 8000

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# Plain HTTP only redirects to HTTPS, unless the container is started with `-D DEV_HTTP`
# (deploy/docker-compose.dev-http.yml: development/testing only, never for a real deployment).
<VirtualHost *:80>
    <IfDefine DEV_HTTP>
        Include conf/site.conf
    </IfDefine>
    <IfDefine !DEV_HTTP>
        Redirect permanent / https://localhost:8443/
    </IfDefine>
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/stockforge/certs/dev.crt
    SSLCertificateKeyFile /etc/stockforge/certs/dev.key
    Include conf/site.conf
</VirtualHost>