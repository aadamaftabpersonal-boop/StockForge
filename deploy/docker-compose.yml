name: stockforge
# Default (what the tests use):   docker compose -f deploy/docker-compose.yml --env-file .env up -d --wait
#   -> MySQL only.
# Whole stack (Apache + TLS + app): docker compose -f deploy/docker-compose.yml --env-file .env --profile stack up -d --build --wait
#   -> https://localhost:8443  (self-signed dev certificate; create it first: scripts/dev.sh sh scripts/gen-dev-cert.sh)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stockforge}
    # No host port is published: the app and tests reach the db over the compose network.
    command: ["--character-set-server=utf8mb4", "--transaction-isolation=READ-COMMITTED"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - dbdata:/var/lib/mysql

  app:
    profiles: ["stack"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    depends_on:
      db: { condition: service_healthy }
    environment:
      SF_DB_HOST: db
      SF_DB_USER: ${SF_DB_USER:-sf_app}
      SF_DB_PASSWORD: ${SF_DB_PASSWORD:?set in .env}
      SF_DB_NAME: ${SF_DB_NAME:-stockforge}
      SF_METRICS_TOKEN: ${SF_METRICS_TOKEN:-}
      SF_TRUST_PROXY: "1"          # the only client the app sees is Apache, which appends the real address
      SF_COOKIE_SECURE: "1"        # served over HTTPS by Apache
      SF_WORKERS: "8"
    # Not published: only Apache, on the compose network, can reach the app.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    profiles: ["stack"]
    image: httpd:2.4
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/site.conf:/usr/local/apache2/conf/site.conf:ro
      - ./apache/certs:/etc/stockforge/certs:ro
      - ../web:/usr/local/apache2/htdocs:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
volumes:
  dbdata:
